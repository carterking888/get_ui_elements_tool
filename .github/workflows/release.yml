name: Release

# push 到 main -> 自动打 Windows + macOS 双架构包并发「预发布」Release;
# 手动打 tag (git tag v1.1.0 && git push origin v1.1.1) -> 正式 Release, 版本不递增。
#
# 版本号由 version job 统一算一次 (规则见 ci_version.sh):
#   每次 push 到 main -> 最新 v* tag 的 patch +1   (v1.0.0 -> v1.0.1 -> ...)
#   应用内显示的版本 / 产物 zip 文件名 / GitHub tag / Release 标题全部同源。
#
# 产物 (挂在 Release 的 assets):
#   element_picker_v<ver>_win64.zip
#   element_picker_v<ver>_win64_lite.zip          (轻量版 ~30MB, 需系统 Chrome/Edge)
#   element_picker_v<ver>_macos_arm64.zip / .dmg   (Apple Silicon)
#   element_picker_v<ver>_macos_x86_64.zip / .dmg  (Intel)
#   同架构 *_lite.zip                              (轻量版)
#
# 完整包内置 Chromium, 目标机零环境解压即用; Lite 包启动时自动改用系统 Chrome/Edge。

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_REF: main
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: '1'

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ver: ${{ steps.v.outputs.ver }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || env.BUILD_REF }}
          fetch-depth: 0

      # 预检: CI 依赖的文件必须真的在仓库里 (本地有但被 .gitignore 通配规则吃掉过坑)
      - name: Preflight (必需文件是否都在仓库里)
        run: |
          missing=""
          for f in ci_version.sh build_mac.sh build_win.py bundle_browsers.py element_picker.spec requirements.txt config/icon.ico config/icon.png web/index.html; do
            [ -f "$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "::error::以下文件在当前提交里不存在：$missing"
            echo "通常是本地有、但被 .gitignore 排除所以没提交进仓库。"
            echo "排查: git check-ignore -v <文件>; 修复: .gitignore 加 !<文件> 后重新提交。"
            exit 1
          fi
          echo "必需文件就位"

      # ★ 统一 `tr -d '\r' < xx.sh | bash` 执行脚本: Windows runner 默认 CRLF,
      #   带 \r 的脚本会报 $'\r': command not found
      - name: Resolve version (最新 tag 的 patch +1)
        id: v
        run: |
          VER=$(tr -d '\r' < ci_version.sh | bash)
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "本次构建版本：v$VER"
          echo "### 本次版本 v$VER" >> "$GITHUB_STEP_SUMMARY"

  macos:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        # macos-14+ 是 Apple Silicon(arm64); Intel 必须用 macos-15-intel
        # (macos-13 已下线: label 无匹配 runner 时会排队到 24h 上限再自动取消)
        include:
          - os: macos-14
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || env.BUILD_REF }}
          fetch-depth: 0

      - name: Show build source
        run: |
          echo "event    : ${{ github.event_name }}"
          echo "commit   : $(git rev-parse --short HEAD)"
          echo "subject  : $(git log -1 --format=%s)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set version
        run: tr -d '\r' < ci_version.sh | bash -s -- "${{ needs.version.outputs.ver }}"

      # build_mac.sh 内部自建 venv、装依赖、下载 Chromium、打包、签名、出 zip/dmg
      - name: Build .app + .dmg (完整版)
        run: |
          chmod +x build_mac.sh
          ./build_mac.sh --dmg

      - name: Smoke test（完整版：可执行文件存在且进程能活过初始化）
        run: |
          NAME="element_picker"
          APP_VER=$(grep -oE 'APP_VERSION *= *"[^"]+"' app.py | head -1 | cut -d'"' -f2)
          EXE="dist/$NAME.app/Contents/MacOS/$NAME"
          test -x "$EXE" || { echo "[错误] 找不到 $EXE"; exit 1; }
          for ext in zip dmg; do
            test -f "dist/${NAME}_v${APP_VER}_macos_${{ matrix.arch }}.${ext}" \
              || { echo "[错误] 分发文件缺失: *_macos_${{ matrix.arch }}.${ext}"; exit 1; }
          done
          # 内置 Chromium 自检
          N=$(find "dist/$NAME.app/Contents" -path "*.local-browsers/chromium*" -name "Chromium" | wc -l)
          [ "$N" -ge 1 ] || { echo "[错误] 包内没有内置 Chromium"; exit 1; }
          # 后台拉起 app, 只看进程能否活过初始化
          "$EXE" & PID=$!
          sleep 15
          kill -0 "$PID" 2>/dev/null && { echo "进程存活 15s -> OK"; kill "$PID" || true; } \
            || { echo "[错误] 进程 15s 内退出"; exit 1; }

      # Lite 轻量版: 复用 venv, 跳过 Chromium 下载, 秒级增量
      - name: Build Lite .app + zip
        run: ./build_mac.sh --lite

      - name: Smoke test (Lite 产物)
        run: |
          NAME="element_picker"
          APP_VER=$(grep -oE 'APP_VERSION *= *"[^"]+"' app.py | head -1 | cut -d'"' -f2)
          test -f "dist/${NAME}_v${APP_VER}_macos_${{ matrix.arch }}_lite.zip" \
            || { echo "[错误] Lite zip 未生成: *_macos_${{ matrix.arch }}_lite.zip"; exit 1; }
          N=$(find "dist/$NAME.app/Contents" -path "*.local-browsers/chromium*" -name "Chromium" | wc -l)
          [ "$N" -eq 0 ] || { echo "[错误] Lite 包里混入了 Chromium"; exit 1; }

      - name: List dist
        run: ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-macos-${{ matrix.arch }}
          path: |
            dist/element_picker_*.zip
            dist/element_picker_*.dmg
          if-no-files-found: error
          retention-days: 14

  windows:
    needs: version
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || env.BUILD_REF }}
          fetch-depth: 0

      - name: Show build source
        shell: bash
        run: |
          echo "event    : ${{ github.event_name }}"
          echo "commit   : $(git rev-parse --short HEAD)"
          echo "subject  : $(git log -1 --format=%s)"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Set version
        shell: bash
        run: tr -d '\r' < ci_version.sh | bash -s -- "${{ needs.version.outputs.ver }}"

      - name: Install dependencies
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt "pyinstaller>=6.0"

      - name: Download Chromium for bundling
        run: python -m playwright install chromium

      - name: PyInstaller pack + zip (文件名自带版本号)
        run: python build_win.py

      - name: Smoke test（完整版：产物完整 + 内置 Chromium）
        shell: bash
        run: |
          APP_VER=$(grep -oE 'APP_VERSION *= *"[^"]+"' app.py | head -1 | cut -d'"' -f2)
          test -f "dist/element_picker_v${APP_VER}_win64.zip" \
            || { echo "[错误] 分发 zip 未生成"; exit 1; }
          test -f "dist/element_picker/element_picker.exe" \
            || { echo "[错误] element_picker.exe 未生成"; exit 1; }
          N=$(find dist/element_picker -path "*.local-browsers/chromium*" | wc -l)
          echo "内置 Chromium 文件数: $N"
          [ "$N" -ge 10 ] || { echo "[错误] 包内没有内置 Chromium"; exit 1; }

      # Lite 轻量版: 跳过 Chromium, 产物 ~30MB, 启动时用系统 Chrome/Edge
      - name: PyInstaller pack + zip (Lite 轻量版)
        run: python build_win.py --lite

      - name: Smoke test (Lite 产物)
        shell: bash
        run: |
          APP_VER=$(grep -oE 'APP_VERSION *= *"[^"]+"' app.py | head -1 | cut -d'"' -f2)
          test -f "dist/element_picker_v${APP_VER}_win64_lite.zip" \
            || { echo "[错误] Lite zip 未生成"; exit 1; }
          N=$(find dist/element_picker -path "*.local-browsers/chromium*" | wc -l)
          [ "$N" -eq 0 ] || { echo "[错误] Lite 包里混入了 Chromium"; exit 1; }

      - name: List dist
        shell: bash
        run: ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-win64
          path: dist/element_picker_*.zip
          if-no-files-found: error
          retention-days: 14

  # 统一在最后一步建 Release + 挂 assets, 避免 mac/win 并发创建 Release 冲突
  publish:
    needs: [version, macos, windows]
    # 任一平台失败也把已构建成功的那部分发出去, 否则连 tag/Release 都看不到
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || env.BUILD_REF }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          path: dist
          merge-multiple: true

      - name: Check downloaded assets
        run: |
          echo "下载到的产物："
          ls -1 dist || true
          N=$(ls -1 dist/*.zip dist/*.dmg 2>/dev/null | wc -l)
          [ "$N" -gt 0 ] || { echo "[错误] 没有任何产物 (所有平台都失败了), 不建 Release"; exit 1; }
          [ "$N" -ge 8 ] || echo "::warning::只拿到 $N 个产物 (正常是 8 个: win64 完整+Lite, 双架构 mac 各 zip/dmg/Lite), 本次 Release 不完整"

      - name: Compute tag / version
        id: meta
        run: |
          VER="${{ needs.version.outputs.ver }}"
          [ -n "$VER" ] || VER=$(tr -d '\r' < ci_version.sh | bash)
          TAG="v${VER}"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            PRE=false
          else
            PRE=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
          echo "title=ElementPicker v${VER}" >> "$GITHUB_OUTPUT"
          {
            echo "## 产物"
            echo ""
            echo "| 平台 | 文件 |"
            echo "|---|---|"
            for f in dist/*.zip dist/*.dmg; do
              [ -f "$f" ] || continue
              case "$(basename "$f")" in
                *_lite*) plat="轻量版（需本机 Chrome/Edge）" ;;
                *win64*) plat="Windows" ;;
                *.dmg)   plat="macOS（安装镜像）" ;;
                *)       plat="macOS（免安装 zip）" ;;
              esac
              echo "| $plat | \`$(basename "$f")\` |"
            done
            echo ""
            echo "构建提交：\`$(git rev-parse --short HEAD)\` $(git log -1 --format=%s)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "tag=$TAG prerelease=$PRE"

      - name: List assets
        run: ls -lh dist

      - name: Create Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.title }}
          body: |
            ✨ ElementPicker 元素定位拾取器

            桌面端 Web 元素定位拾取工具，深色 / 浅色双主题，五大模块：

            - 🌐 浏览器拾取: 内置 Chromium 独立窗口，悬停高亮 + 点击采集，拾取/浏览双模式
            - 🎯 定位结果: XPath / CSS 选择器 / ID / NAME 候选与唯一性实测，代码片段一键生成
            - 🗂 历史记录: 本地落库、搜索、收藏分组、导出 JSON
            - 📱 App 拾取: CDP 远程调试接管 WebView2 / Electron 应用内页面
            - 🌗 深浅主题: 一键切换，选择持久化

            ### 下载哪个

            | 系统 | 下载 | 说明 |
            |---|---|---|
            | Windows | `*_win64.zip` | 解压后双击 `element_picker.exe`，已内置 Chromium，无需任何环境 |
            | macOS | `*_macos_arm64.dmg`（M 系列）/ `*_macos_x86_64.dmg`（Intel） | 打开镜像拖进 Applications |
            | macOS | 同架构 `*.zip` | 不想装，解压直接运行 |
            | 任意系统 | `*_lite.zip` | 轻量版 (~30MB)：不内置浏览器，需本机已装 Chrome 或 Edge |

            > macOS 首次打开若提示「无法验证开发者」：右键 -> 打开（仅一次）。
            > 芯片选错会提示「无法打开」，M 系列选 arm64。
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.dmg
